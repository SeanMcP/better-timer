<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Better Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root { --bg: #111; --fg: #eee; --dim: #666; --btn: rgb(255 255 255 / .12); --accent: #e53935; --gap: 10px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; user-select: none; overscroll-behavior: none; }
  main { height: 100dvh; display: flex; flex-direction: column; gap: var(--gap);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main[hidden] { display: none; }
  /* Keep controls phone-sized on wide screens; the running timer itself can go big */
  #setup, #run .controls { inline-size: 100%; max-inline-size: 480px; margin-inline: auto; }
  button { font: inherit; color: var(--fg); background: var(--btn); border: 0;
    border-radius: 16px; font-size: 18px; cursor: pointer; padding: 0; }
  button:active { filter: brightness(1.5); }
  button[data-icon] { display: flex; align-items: center; justify-content: center; }
  button svg { width: 28px; height: 28px; fill: currentColor; }
  #start svg { width: 32px; height: 32px; }

  /* A box that its .time child scales to fill (see fit()) */
  .box { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .time { font-variant-numeric: tabular-nums; font-weight: 300; line-height: 1; white-space: nowrap; }

  /* Setup */
  #entry.empty { color: var(--dim); }
  .presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--gap); }
  .presets button { height: 48px; font-size: 16px; }
  .keypad { flex: 1.6 1 0; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 1fr; gap: var(--gap); }
  .keypad button { font-size: clamp(24px, 5vh, 40px); }
  #start { height: 72px; flex: none; background: var(--accent); font-size: 22px; font-weight: 600; }
  #start:disabled { opacity: .3; }

  /* Running */
  #pie { width: 100%; height: 100%; }
  #pie .slice { fill: var(--accent); }
  .visual #digits, #run:not(.visual) #pie { display: none; }
  .controls { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; gap: var(--gap); }
  .controls button { height: 64px; }
  .paused #digits, .paused #pie { opacity: .4; }
  .paused #pause { background: var(--accent); font-weight: 600; }
  .done { animation: flash 1s steps(1) infinite; }
  @keyframes flash { 50% { background: var(--accent); } }
</style>
</head>
<body>

<main id="setup">
  <div class="box"><div id="entry" class="time empty">00:00</div></div>
  <div class="presets">
    <button data-s="60">1m</button>
    <button data-s="120">2m</button>
    <button data-s="180">3m</button>
    <button data-s="300">5m</button>
    <button data-s="600">10m</button>
  </div>
  <div class="keypad">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button>00</button><button>0</button><button data-k="del" data-icon="delete" aria-label="Delete"></button>
  </div>
  <button id="start" data-icon="play" aria-label="Start" disabled></button>
</main>

<main id="run" hidden>
  <div class="controls">
    <button id="mode" data-icon></button>
    <button id="vol" data-icon></button>
    <button id="fs" data-icon="maximize" aria-label="Full screen"></button>
  </div>
  <div id="face" class="box">
    <div id="digits" class="time"></div>
    <svg id="pie" viewBox="0 0 100 100">
      <path class="slice"/>
      <circle cx="50" cy="50" r="47" fill="none" stroke-width="3" style="stroke: var(--fg)"/>
    </svg>
  </div>
  <div class="controls">
    <button id="pause" data-icon></button>
    <button id="reset" data-icon="reset" aria-label="Reset"></button>
    <button id="cancel" data-icon="cancel" aria-label="Cancel"></button>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);

// Icons: Phosphor (phosphoricons.com, MIT), 256x256 grid.
// Playback controls use the solid "fill" weight; everything else uses "bold" so line weights match.
const ICONS = {
  play: '<path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/>',
  pause: '<path d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"/>',
  stop: '<path d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z"/>',
  reset: '<path d="M228,128a100,100,0,0,1-98.66,100H128a99.39,99.39,0,0,1-68.62-27.29,12,12,0,0,1,16.48-17.45,76,76,0,1,0-1.57-109c-.13.13-.25.25-.39.37L54.89,92H72a12,12,0,0,1,0,24H24a12,12,0,0,1-12-12V56a12,12,0,0,1,24,0V76.72L57.48,57.06A100,100,0,0,1,228,128Z"/>',
  cancel: '<path d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"/>',
  delete: '<path d="M216,36H68.53a20.09,20.09,0,0,0-17.15,9.71L5.71,121.83a12,12,0,0,0,0,12.34l45.67,76.12A20.09,20.09,0,0,0,68.53,220H216a20,20,0,0,0,20-20V56A20,20,0,0,0,216,36Zm-4,160H70.8L30,128,70.8,60H212ZM103.51,143.51,119,128l-15.52-15.51a12,12,0,0,1,17-17L136,111l15.51-15.52a12,12,0,0,1,17,17L153,128l15.52,15.51a12,12,0,0,1-17,17L136,145l-15.51,15.52a12,12,0,0,1-17-17Z"/>',
  visual: '<path d="M93.82,116.64A12,12,0,0,0,100,106.15V40.74A12,12,0,0,0,83,29.83,108.26,108.26,0,0,0,20,128c0,3.37.16,6.76.47,10.1a12,12,0,0,0,17.76,9.38ZM76,62.06v37L44.81,116.36A84.39,84.39,0,0,1,76,62.06ZM128,20a12,12,0,0,0-12,12v89.53L39.18,166.27a12,12,0,0,0-4.3,16.46A108,108,0,1,0,128,20Zm0,192a84.47,84.47,0,0,1-65.57-31.5L134,138.79a12,12,0,0,0,6-10.37V44.85A84,84,0,0,1,128,212Z"/>',
  countdown: '<path d="M128,44a96,96,0,1,0,96,96A96.11,96.11,0,0,0,128,44Zm0,168a72,72,0,1,1,72-72A72.08,72.08,0,0,1,128,212ZM164.49,99.51a12,12,0,0,1,0,17l-28,28a12,12,0,0,1-17-17l28-28A12,12,0,0,1,164.49,99.51ZM92,16A12,12,0,0,1,104,4h48a12,12,0,0,1,0,24H104A12,12,0,0,1,92,16Z"/>',
  loud: '<path d="M157.27,21.22a12,12,0,0,0-12.64,1.31L75.88,76H32A20,20,0,0,0,12,96v64a20,20,0,0,0,20,20H75.88l68.75,53.47A12,12,0,0,0,164,224V32A12,12,0,0,0,157.27,21.22ZM36,100H68v56H36Zm104,99.46L92,162.13V93.87l48-37.33ZM212,128a44,44,0,0,1-11,29.11,12,12,0,1,1-18-15.88,20,20,0,0,0,0-26.43,12,12,0,0,1,18-15.86A43.94,43.94,0,0,1,212,128Zm40,0a83.87,83.87,0,0,1-21.39,56,12,12,0,0,1-17.89-16,60,60,0,0,0,0-80,12,12,0,1,1,17.88-16A83.87,83.87,0,0,1,252,128Z"/>',
  quiet: '<path d="M157.27,21.22a12,12,0,0,0-12.64,1.31L75.88,76H32A20,20,0,0,0,12,96v64a20,20,0,0,0,20,20H75.88l68.75,53.47A12,12,0,0,0,164,224V32A12,12,0,0,0,157.27,21.22ZM36,100H68v56H36Zm104,99.46L92,162.13V93.87l48-37.33ZM212,128a44,44,0,0,1-11,29.11,12,12,0,0,1-18-15.88,20,20,0,0,0,0-26.44,12,12,0,0,1,18-15.85A43.94,43.94,0,0,1,212,128Z"/>',
  silent: '<path d="M157.27,21.22a12,12,0,0,0-12.64,1.31L75.88,76H32A20,20,0,0,0,12,96v64a20,20,0,0,0,20,20H75.88l68.75,53.47A12,12,0,0,0,164,224V32A12,12,0,0,0,157.27,21.22ZM36,100H68v56H36Zm104,99.47L92,162.12V93.88l48-37.34Zm108.49-55.95a12,12,0,0,1-17,17L216,145l-15.51,15.52a12,12,0,0,1-17-17L199,128l-15.52-15.51a12,12,0,0,1,17-17L216,111l15.51-15.51a12,12,0,0,1,17,17L233,128Z"/>',
  maximize: '<path d="M220,48V96a12,12,0,0,1-24,0V77l-39.51,39.52a12,12,0,0,1-17-17L179,60H160a12,12,0,0,1,0-24h48A12,12,0,0,1,220,48ZM99.51,139.51,60,179V160a12,12,0,0,0-24,0v48a12,12,0,0,0,12,12H96a12,12,0,0,0,0-24H77l39.52-39.51a12,12,0,0,0-17-17Z"/>',
  minimize: '<path d="M216.49,56.48,177,96h19a12,12,0,0,1,0,24H148a12,12,0,0,1-12-12V60a12,12,0,0,1,24,0V79l39.51-39.52a12,12,0,0,1,17,17ZM108,136H60a12,12,0,0,0,0,24H79L39.51,199.51a12,12,0,0,0,17,17L96,177v19a12,12,0,0,0,24,0V148A12,12,0,0,0,108,136Z"/>',
};
function setIcon(el, name, label) {
  el.innerHTML = `<svg viewBox="0 0 256 256" aria-hidden="true">${ICONS[name]}</svg>`;
  if (label) el.setAttribute('aria-label', label);
  el.title = el.getAttribute('aria-label') || '';
}
document.querySelectorAll('[data-icon]').forEach(b => b.dataset.icon && setIcon(b, b.dataset.icon));

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ---- Helpers ----
const fmt = sec => {
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
};

// Scale text to fill its .box parent. Digits are tabular, so this only needs to
// rerun when the character count or screen size changes.
function fit(el) {
  const box = el.parentElement;
  if (!box.clientWidth || !el.offsetWidth) return; // hidden: refit when shown
  el.style.fontSize = '100px';
  const scale = Math.min(box.clientWidth / el.scrollWidth, box.clientHeight * 0.9 / el.scrollHeight);
  el.style.fontSize = 100 * scale + 'px';
}
function setText(el, text) {
  const refit = el.textContent.length !== text.length;
  el.textContent = text;
  if (refit) fit(el);
}
addEventListener('resize', () => { fit($('#entry')); fit($('#digits')); });

// ---- Setup: Android-style digit entry (digits shift in from the right) ----
let digits = '';
const entrySeconds = () => {
  const d = digits.padStart(6, '0');
  return +d.slice(0, 2) * 3600 + +d.slice(2, 4) * 60 + +d.slice(4, 6);
};
function renderEntry() {
  const d = digits.padStart(6, '0');
  setText($('#entry'), digits.length > 4 ? `${d.slice(0, 2)}:${d.slice(2, 4)}:${d.slice(4)}` : `${d.slice(2, 4)}:${d.slice(4)}`);
  $('#entry').classList.toggle('empty', !digits);
  $('#start').disabled = !entrySeconds();
}
$('.keypad').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.k === 'del') digits = digits.slice(0, -1);
  else digits = (digits + b.textContent).replace(/^0+/, '').slice(0, 6);
  renderEntry();
};
$('.presets').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  start(+b.dataset.s);
};
$('#start').onclick = () => start(entrySeconds());

// ---- Timer ----
let total = 0, end = 0, left = 0, paused = false, done = false, loop, alarm, audio, lock;
let visual = false;
try { visual = localStorage.getItem('visual') === '1'; } catch {}

// Alarm volume: three-way toggle, saved like the mode
const VOLUMES = { loud: 0.15, quiet: 0.03, silent: 0 };
let volume = 'loud';
try { const saved = localStorage.getItem('volume'); if (Object.hasOwn(VOLUMES, saved)) volume = saved; } catch {}

// Browsers only allow sound after a tap, so create/resume audio on any tap.
function unlockAudio() {
  audio ||= new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') audio.resume();
}
addEventListener('pointerdown', unlockAudio);

// Keep the URL in sync with the running timer so a reload/revisit restores it
function setURL(sec) {
  const q = sec ? `?t=${sec}&m=${visual ? 'visual' : 'countdown'}&v=${volume}` : '';
  history.replaceState(null, '', location.pathname + q);
}

function start(sec) {
  if (!sec) return;
  setURL(sec);
  total = sec * 1000; end = Date.now() + total; paused = done = false;
  unlockAudio();
  $('#setup').hidden = true; $('#run').hidden = false;
  wake(true);
  clearInterval(loop); loop = setInterval(tick, 100); tick(); fit($('#digits'));
  renderButtons();
}

// Left button: Pause while running, Start while paused, Stop while ringing
function renderButtons() {
  if (done) setIcon($('#pause'), 'stop', 'Stop alarm');
  else if (paused) setIcon($('#pause'), 'play', 'Start');
  else setIcon($('#pause'), 'pause', 'Pause');
  $('#run').classList.toggle('paused', paused && !done);
}

function tick() {
  const ms = paused ? left : end - Date.now();
  if (ms <= 0 && !done) return finish();
  const rem = Math.max(0, ms), text = fmt(Math.ceil(rem / 1000));
  setText($('#digits'), text);
  drawPie(rem / total);
  document.title = done ? 'Done!' : text + ' · Better Timer';
}

// Draw the red wedge for a 0..1 fraction, sweeping counterclockwise from 12 o'clock
// (like a Time Timer). Its radius matches the ring's center line.
const slice = $('#pie .slice');
function drawPie(frac) {
  const R = 47, f = Math.min(Math.max(frac, 0), 1);
  if (f >= 1) return slice.setAttribute('d', `M50 ${50 - R}A${R} ${R} 0 1 0 50 ${50 + R}A${R} ${R} 0 1 0 50 ${50 - R}Z`);
  if (f <= 0) return slice.setAttribute('d', '');
  const a = f * 2 * Math.PI, x = 50 - R * Math.sin(a), y = 50 - R * Math.cos(a);
  slice.setAttribute('d', `M50 50L50 ${50 - R}A${R} ${R} 0 ${f > 0.5 ? 1 : 0} 0 ${x} ${y}Z`);
}

// Redraw the pie every display frame so it shrinks smoothly. tick() still
// handles digits and finishing, since animation frames pause in the background.
function frame() {
  if (visual && !$('#run').hidden && !paused && !done) {
    drawPie(Math.max(0, end - Date.now()) / total);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function finish() {
  done = true; clearInterval(loop); tick();
  document.body.classList.add('done');
  renderButtons();
  // Classic digital watch alarm: a 4 kHz piezo-style square wave,
  // four quick beeps per burst, one burst per second.
  const ring = () => {
    navigator.vibrate?.([60, 65, 60, 65, 60, 65, 60]);
    const level = VOLUMES[volume]; // read each burst so changes apply mid-alarm
    if (level) [0, 0.125, 0.25, 0.375].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime + t;
      o.type = 'square'; o.frequency.value = 4096;
      o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(level, at + 0.003); // tiny ramps avoid clicks
      g.gain.setValueAtTime(level, at + 0.057);
      g.gain.linearRampToValueAtTime(0, at + 0.06);
      o.start(at); o.stop(at + 0.06);
    });
  };
  ring(); alarm = setInterval(ring, 1000);
}

function stopAlarm() {
  clearInterval(alarm); navigator.vibrate?.(0);
  document.body.classList.remove('done');
}

$('#pause').onclick = () => {
  if (done) return stop();
  paused = !paused;
  if (paused) left = end - Date.now(); else end = Date.now() + left;
  renderButtons(); tick();
};

// Silence the alarm and wait at full time for Start
function stop() {
  stopAlarm();
  done = false; paused = true; left = total;
  clearInterval(loop); loop = setInterval(tick, 100);
  renderButtons(); tick();
}

// Start over from the full time
function reset() {
  stopAlarm(); start(total / 1000);
}

// Back to the time entry page
function exit() {
  stopAlarm(); clearInterval(loop); wake(false);
  done = false; paused = false;
  $('#run').classList.remove('paused');
  $('#run').hidden = true; $('#setup').hidden = false;
  document.title = 'Better Timer';
  setURL(0);
  fit($('#entry'));
}
$('#reset').onclick = reset;
$('#cancel').onclick = exit;

// ---- Countdown / visual toggle (button or tap the face) ----
function setMode(v, save = true) {
  visual = v;
  if (save) try { localStorage.setItem('visual', v ? '1' : '0'); } catch {}
  if (!$('#run').hidden) setURL(total / 1000);
  $('#run').classList.toggle('visual', v);
  setIcon($('#mode'), v ? 'countdown' : 'visual', v ? 'Show countdown' : 'Show visual timer');
  fit($('#digits'));
}
$('#mode').onclick = () => setMode(!visual);
$('#face').onclick = () => done ? stop() : setMode(!visual);
// URL params override the saved mode for this visit: ?m=visual|countdown
const params = new URLSearchParams(location.search);
const m = params.get('m');
setMode(m === 'visual' ? true : m === 'countdown' ? false : visual, false);

// ---- Volume toggle: Loud → Quiet → Silent (URL ?v= overrides for this visit) ----
function setVolume(v, save = true) {
  volume = v;
  if (save) try { localStorage.setItem('volume', v); } catch {}
  setIcon($('#vol'), v, `Volume: ${v}`);
  if (!$('#run').hidden) setURL(total / 1000);
}
$('#vol').onclick = () => {
  const order = Object.keys(VOLUMES);
  setVolume(order[(order.indexOf(volume) + 1) % order.length]);
};
const v = params.get('v');
setVolume(Object.hasOwn(VOLUMES, v) ? v : volume, false);

// ---- Full screen ----
$('#fs').onclick = () => document.fullscreenElement
  ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
document.addEventListener('fullscreenchange', () =>
  document.fullscreenElement ? setIcon($('#fs'), 'minimize', 'Exit full screen') : setIcon($('#fs'), 'maximize', 'Full screen'));

// ---- Keep screen on while a timer is showing ----
async function wake(on) {
  try {
    if (on && !lock) { lock = await navigator.wakeLock.request('screen'); lock.onrelease = () => lock = null; }
    if (!on && lock) { await lock.release(); lock = null; }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && $('#setup').hidden) { wake(true); tick(); }
});

renderEntry();
fit($('#entry'));

// ?t=<seconds> loads a timer, paused at full time until you tap Start
const t = Math.min(Math.floor(+params.get('t')), 359999); // max 99:59:59
if (t > 0) { start(t); paused = true; left = total; renderButtons(); tick(); }
</script>
</body>
</html>
